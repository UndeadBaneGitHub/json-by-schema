name: Publish to npm & Deploy GitHub Pages Demo

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.2.1 or 1.0.0)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'publish-and-pages'
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Build, Test & Publish to npmjs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js for npmjs registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync package.json version with release tag or input
        run: |
          TARGET_VERSION="${{ github.event.inputs.version || github.event.release.tag_name }}"
          if [ -n "$TARGET_VERSION" ]; then
            npm version "$TARGET_VERSION" --no-git-tag-version --allow-same-version
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome lint
        run: pnpm lint

      - name: Run Vitest unit & component tests
        run: pnpm test

      - name: Build library bundle
        run: pnpm build

      - name: Publish package to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  build-demo:
    name: Build Demo Playground
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo static site
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: pnpm build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy-pages:
    name: Deploy Demo to GitHub Pages
    needs: build-demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
